version: '3.8'

services:
  bj_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bj_backend
    restart: always # Auto-restart if crashes
    ports:
      - "3000:3000"
    # Semua konfigurasi (DB, JWT, MinIO, Redis, Midtrans) diambil dari file .env
    # Salin .env.example -> .env lalu isi dengan nilai asli Anda.
    env_file:
      - .env
    depends_on:
      - bj_sql_server
      - bj_minio
      - bj_redis

  bj_redis:
    image: redis:7-alpine
    container_name: bj_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  bj_sql_server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bj_sql_server
    environment:
      - ACCEPT_EULA=Y
      # Default hanya untuk development LOKAL — di production pakai .env!
      # (jangan pernah pakai kredensial production di file ini)
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-Password123!}
    ports:
      - "1434:1433"
    volumes:
      - bj_sqldata:/var/opt/mssql
    restart: unless-stopped

  bj_minio:
    image: quay.io/minio/minio:latest
    container_name: bj_minio
    environment:
      # Default hanya untuk development LOKAL — di production pakai .env!
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-AdminBJ123}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-BJAdmin123#}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bj_minio_data:/data
    restart: unless-stopped

volumes:
  bj_sqldata:
  bj_minio_data:
