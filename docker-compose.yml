services:
  bj_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bj_backend
    restart: always # Auto-restart jika terjadi crash/server reboot
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      bj_sql_server:
        condition: service_healthy
      bj_redis:
        condition: service_healthy
      bj_minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  bj_redis:
    image: redis:7-alpine
    container_name: bj_redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  bj_sql_server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bj_sql_server
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-Password123!}
    ports:
      - "1434:1433"
    volumes:
      - bj_sqldata:/var/opt/mssql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-Password123!}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  bj_minio:
    image: quay.io/minio/minio:latest
    container_name: bj_minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-AdminBJ123}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-BJAdmin123#}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bj_minio_data:/data
    restart: always

volumes:
  bj_sqldata:
  bj_minio_data:
